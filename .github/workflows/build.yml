name: Build LyriCraft

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "File ZIP project tidak ditemukan!"
            exit 1
          fi
          mkdir project
          unzip "$ZIP" -d project
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi
          gradle -p "$(dirname "$ROOT")" build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LyriCraftMobile-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
